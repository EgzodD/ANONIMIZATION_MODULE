# CI — контур 1: быстрые проверки на каждый push и pull request.
# Формат совместим с GitHub Actions и gitea Actions (файл-близнец в .github/workflows/).
#
# Что здесь НЕ гоняется: приватностный гейт LeakRate (маркер requires_model) —
# ему нужна дообученная PERSON-модель (ruBERT), которой нет в репозитории.
# См. job "privacy-gate" ниже и pyproject.toml.

name: CI

on:
  push:
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download ru_core_news_lg
          pip install ruff pytest-cov pip-audit

      - name: Линтер (статический анализ)
        run: ruff check app/ tests/   # блокирующий: код чист (GramLynx исключён, идиомы FastAPI в ignore — см. pyproject.toml)

      - name: Безопасность — скан уязвимостей в зависимостях
        # Пока информационный: обновление зависимостей вынесено в отдельную
        # задачу с прогоном тестов. После апдейта убрать '|| true' — шаг станет
        # блокирующим.
        run: pip-audit -r requirements.txt || true

      - name: Тесты (модель-независимый контур) + покрытие
        # Модели PERSON в чекауте нет (114 МБ, models/ в .gitignore), а без неё
        # сервис намеренно не стартует — поэтому здесь явно разрешаем запуск.
        # Тесты, которым модель нужна, помечены requires_model и исключены.
        env:
          ALLOW_NO_PERSON_MODEL: "true"
        run: pytest -m "not requires_model" --cov=app --cov-report=term-missing

  # ── Приватностный гейт (LeakRate) ─────────────────────────────────────────
  # Требует дообученную PERSON-модель (ruBERT), которой нет в репозитории.
  # Активируется САМ, как только задан секрет PERSON_MODEL_URL (ссылка на .tar.gz
  # с моделью) — см. scripts/fetch_person_model.sh.
  # Без секрета job проходит как no-op (шаги пропускаются), CI не краснеет.
  privacy-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Есть ли модель в секретах?
        id: check
        run: |
          if [ -z "${{ secrets.PERSON_MODEL_URL }}" ]; then
            echo "модель не сконфигурирована (нет секрета PERSON_MODEL_URL) — гейт пропущен"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.configured == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей (+ transformers/torch CPU)
        if: steps.check.outputs.configured == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download ru_core_news_lg
          pip install "transformers>=4.40" torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple

      - name: Загрузка PERSON-модели (ruBERT)
        if: steps.check.outputs.configured == 'true'
        env:
          PERSON_MODEL_URL: ${{ secrets.PERSON_MODEL_URL }}
        run: bash scripts/fetch_person_model.sh models/person_ruBERT

      - name: LeakRate — 0 утечек ПДн
        if: steps.check.outputs.configured == 'true'
        env:
          PERSON_MODEL_DIR: models/person_ruBERT
        run: pytest -m requires_model -q
